<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fractional Consulting Tool - Granular Sector Version</title>
  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
      background:#0b1220;
      color:#ffffff;
      margin:0;
      padding:20px;
    }

    h1,h2,h3{
      color:#f59e0b;
      margin-top:0;
    }

    .card{
      background:#111827;
      border:1px solid #374151;
      border-radius:10px;
      padding:16px;
      margin-bottom:16px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(280px,1fr));
      gap:14px;
    }

    label{
      display:block;
      font-weight:bold;
      margin-top:10px;
      margin-bottom:6px;
    }

    input, select, textarea{
      width:100%;
      padding:10px;
      background:#020617;
      color:#ffffff;
      border:1px solid #475569;
      border-radius:6px;
      box-sizing:border-box;
      font-size:14px;
    }

    textarea{
      min-height:90px;
      resize:vertical;
    }

    button{
      margin-top:14px;
      padding:12px 18px;
      background:#f59e0b;
      color:#111827;
      border:none;
      border-radius:6px;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      opacity:0.92;
    }

    .question-block{
      background:#0f172a;
      border:1px solid #334155;
      border-radius:8px;
      padding:12px;
      margin-bottom:12px;
    }

    .question-title{
      font-weight:bold;
      margin-bottom:8px;
      line-height:1.45;
    }

    .report{
      white-space:pre-wrap;
      background:#020617;
      border:1px solid #334155;
      border-radius:8px;
      padding:16px;
      min-height:180px;
      line-height:1.6;
    }

    .small{
      font-size:12px;
      color:#94a3b8;
    }
  </style>
</head>
<body>

  <h1>Fractional Consulting Diagnostic Tool</h1>

  <div class="card">
    <h2>1. Client Profile</h2>
    <div class="grid">
      <div>
        <label>Client Name</label>
        <input id="clientName" placeholder="Enter client or company name" />
      </div>

      <div>
        <label>Industry</label>
        <select id="industry" onchange="loadSubsectors()">
          <option value="">Select Industry</option>
          <option value="hospitality">Hospitality</option>
          <option value="legal">Legal Services</option>
          <option value="retail">Retail</option>
          <option value="healthcare">Healthcare / Medical</option>
          <option value="engineering">Engineering</option>
          <option value="technology">Technology</option>
          <option value="construction">Construction / Contracting</option>
          <option value="education">Education</option>
          <option value="finance">Financial Services</option>
          <option value="logistics">Logistics / Transport</option>
        </select>
      </div>

      <div>
        <label>Sub-sector</label>
        <select id="subsector" onchange="loadSubsectorQuestions()">
          <option value="">Select Sub-sector</option>
        </select>
      </div>

      <div>
        <label>Business Stage</label>
        <select id="stage">
          <option>Startup</option>
          <option>Growth</option>
          <option>Established</option>
          <option>Stagnant</option>
          <option>Distressed / Turnaround</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>2. Core Diagnostic</h2>
    <div id="coreQuestions"></div>
  </div>

  <div class="card">
    <h2>3. Sub-sector Specific Diagnostic</h2>
    <div class="small">Choose Industry first, then choose Sub-sector to load granular questions.</div>
    <div id="subsectorQuestions" style="margin-top:12px;"></div>
  </div>

  <div class="card">
    <h2>4. Consultant Notes</h2>

    <label>Observed Red Flags</label>
    <textarea id="redFlags" placeholder="Enter visible weaknesses, leakages, compliance issues, process gaps, reporting failures, customer service breakdowns, margin issues, etc."></textarea>

    <label>Quick Wins (0-30 days)</label>
    <textarea id="quickWins" placeholder="Enter immediate actions"></textarea>

    <label>Medium-Term Actions (30-90 days)</label>
    <textarea id="mediumTerm" placeholder="Enter stabilization and improvement actions"></textarea>

    <label>Long-Term Actions (90+ days)</label>
    <textarea id="longTerm" placeholder="Enter structural recommendations"></textarea>
  </div>

  <div class="card">
    <h2>5. Generate Advisory Report</h2>
    <button onclick="generateReport()">Generate Report</button>
  </div>

  <div class="card">
    <h2>6. Generated Report</h2>
    <div id="report" class="report">Your report will appear here.</div>
  </div>

    function buildCoreQuestions() {
      const holder = document.getElementById("coreQuestions");
      holder.innerHTML = "";

      coreQuestions.forEach((q, index) => {
        holder.innerHTML += `
          <div class="question-block">
            <div class="question-title">${index + 1}. ${q}</div>
            <label>Rating</label>
            <select id="core_${index}">
              <option value="5">Strong</option>
              <option value="4">Good</option>
              <option value="3">Average</option>
              <option value="2">Weak</option>
              <option value="1">Poor</option>
            </select>
          </div>
        `;
      });
    }

    function loadSubsectors() {
      const industry = document.getElementById("industry").value;
      const subsectorSelect = document.getElementById("subsector");
      const subQuestions = document.getElementById("subsectorQuestions");

      subsectorSelect.innerHTML = `<option value="">Select Sub-sector</option>`;
      subQuestions.innerHTML = "";

      if (!industry || !industrySubsectors[industry]) return;

      industrySubsectors[industry].forEach(item => {
        const option = document.createElement("option");
        option.value = item;
        option.textContent = item;
        subsectorSelect.appendChild(option);
      });
    }

    function loadSubsectorQuestions() {
      const subsector = document.getElementById("subsector").value;
      const holder = document.getElementById("subsectorQuestions");
      holder.innerHTML = "";

      if (!subsector || !subsectorQuestions[subsector]) {
        holder.innerHTML = `<div class="small">No sub-sector questions loaded yet.</div>`;
        return;
      }

      subsectorQuestions[subsector].forEach((q, index) => {
        holder.innerHTML += `
          <div class="question-block">
            <div class="question-title">${index + 1}. ${q}</div>
            <label>Rating</label>
            <select id="sub_${index}">
              <option value="5">Strong</option>
              <option value="4">Good</option>
              <option value="3">Average</option>
              <option value="2">Weak</option>
              <option value="1">Poor</option>
            </select>
          </div>
        `;
      });
    }

    function average(arr) {
      return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
    }

    function generateReport() {
      const clientName = document.getElementById("clientName").value.trim();
      const industry = document.getElementById("industry").value;
      const subsector = document.getElementById("subsector").value;
      const stage = document.getElementById("stage").value;
      const redFlags = document.getElementById("redFlags").value.trim();
      const quickWins = document.getElementById("quickWins").value.trim();
      const mediumTerm = document.getElementById("mediumTerm").value.trim();
      const longTerm = document.getElementById("longTerm").value.trim();

      let coreScores = [];
      for (let i = 0; i < coreQuestions.length; i++) {
        const el = document.getElementById(`core_${i}`);
        if (el) coreScores.push(Number(el.value));
      }

      let subScores = [];
      if (subsector && subsectorQuestions[subsector]) {
        for (let i = 0; i < subsectorQuestions[subsector].length; i++) {
          const el = document.getElementById(`sub_${i}`);
          if (el) subScores.push(Number(el.value));
        }
      }

      const overall = average(coreScores.concat(subScores));
      let verdict = "Moderate";

      if (overall < 2) verdict = "Critical";
      else if (overall < 3.5) verdict = "Needs Improvement";
      else verdict = "Strong";

      const report = `
FRACTIONAL CONSULTING DIAGNOSTIC REPORT

CLIENT: ${clientName || "Not entered"}
INDUSTRY: ${industry || "Not selected"}
SUB-SECTOR: ${subsector || "Not selected"}
BUSINESS STAGE: ${stage}

OVERALL SCORE: ${overall ? overall.toFixed(2) : "N/A"}
STATUS: ${verdict}

SUMMARY
This assessment combines core business-health questions with targeted sub-sector diagnostics for more granular advisory output.

OBSERVED RED FLAGS
${redFlags || "None entered"}

QUICK WINS (0-30 DAYS)
${quickWins || "None entered"}

MEDIUM-TERM ACTIONS (30-90 DAYS)
${mediumTerm || "None entered"}

LONG-TERM ACTIONS (90+ DAYS)
${longTerm || "None entered"}
      `.trim();

      document.getElementById("report").textContent = report;
    }
