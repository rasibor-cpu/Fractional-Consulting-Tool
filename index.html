<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractional Consulting Pro Tool</title>

<style>
body {
  font-family: Arial;
  background: #020617;
  color: #fff;
  padding: 20px;
}

h1 {
  color: #fbbf24;
}

.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

input, textarea, select {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  margin-bottom: 10px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 12px;
  background: #fbbf24;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.kpi {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.kpi div {
  background: #0f172a;
  padding: 10px;
  border-radius: 8px;
  flex: 1;
  text-align: center;
}

.output {
  background: #020617;
  padding: 10px;
  border-radius: 8px;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<h1>Fractional Consulting Pro Tool</h1>

<div class="card">
<h3>Client Info</h3>
<input id="client" placeholder="Client Name">
<input id="industry" placeholder="Industry">
<input id="consultant" placeholder="Consultant Name">
<textarea id="overview" placeholder="Business Overview"></textarea>
</div>

<div class="card">
<h3>Financial Control</h3>
<select id="fin">
<option value="0">No issue</option>
<option value="1">Minor issue</option>
<option value="2">Moderate issue</option>
<option value="3">Major issue</option>
</select>
<textarea id="fin_notes" placeholder="Findings"></textarea>
</div>

<div class="card">
<h3>Revenue Leakage</h3>
<select id="rev">
<option value="0">No issue</option>
<option value="1">Minor issue</option>
<option value="2">Moderate issue</option>
<option value="3">Major issue</option>
</select>
<textarea id="rev_notes" placeholder="Findings"></textarea>
</div>

<div class="card">
<h3>Operations</h3>
<select id="ops">
<option value="0">No issue</option>
<option value="1">Minor issue</option>
<option value="2">Moderate issue</option>
<option value="3">Major issue</option>
</select>
<textarea id="ops_notes" placeholder="Findings"></textarea>
</div>

<div class="card">
<button onclick="generate()">Generate Report</button>
</div>

<div class="kpi">
<div>Total Score<br><strong id="score">0</strong></div>
<div>Risk Level<br><strong id="risk">-</strong></div>
<div>Priority<br><strong id="priority">-</strong></div>
</div>

<div class="card">
<h3>Report</h3>
<div id="output" class="output"></div>
</div>

<script>

function generate(){

let fin = parseInt(document.getElementById("fin").value);
let rev = parseInt(document.getElementById("rev").value);
let ops = parseInt(document.getElementById("ops").value);

let score = fin + rev + ops;

let risk = "Stable";
let priority = "Low";

if(score >= 3) risk = "Moderate";
if(score >= 6) risk = "High";
if(score >= 8) risk = "Critical";

if(score >= 3) priority = "Medium";
if(score >= 6) priority = "High";
if(score >= 8) priority = "Immediate";

document.getElementById("score").innerText = score;
document.getElementById("risk").innerText = risk;
document.getElementById("priority").innerText = priority;

let actions = "";

if(fin > 0) actions += "- Fix financial reporting and controls\n";
if(rev > 0) actions += "- Plug revenue leakage and tighten pricing\n";
if(ops > 0) actions += "- Optimize operations and workflows\n";

let report = `
CLIENT: ${document.getElementById("client").value}

RISK LEVEL: ${risk}
PRIORITY: ${priority}

KEY ACTIONS:
${actions}

DETAILS:

Financial:
${document.getElementById("fin_notes").value}

Revenue:
${document.getElementById("rev_notes").value}

Operations:
${document.getElementById("ops_notes").value}
`;

document.getElementById("output").innerText = report;

}

</script>

</body>
</html>
