<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fractional Consulting – Full Commercial System</title>

<style>
body{font-family:Arial;background:#0b1220;color:white;padding:20px;}
.card{background:#111827;padding:15px;margin-bottom:15px;border-radius:10px;}
input,select,textarea{width:100%;padding:8px;margin-top:5px;background:#020617;color:white;border:1px solid #475569;}
button{padding:12px;background:#f59e0b;border:none;border-radius:6px;margin-top:10px;margin-right:10px;}
.report{white-space:pre-wrap;background:black;padding:15px;border-radius:10px;}
</style>
</head>

<body>

<h1>Fractional Consulting Commercial Engine</h1>

<div class="card">
<label>Client Name</label>
<input id="clientName">

<label>Industry</label>
<select id="industry" onchange="loadSubsectors()">
<option value="">Select</option>
<option value="engineering">Engineering</option>
<option value="medical">Medical</option>
<option value="retail">Retail</option>
<option value="technology">Technology</option>
</select>

<label>Subsector</label>
<select id="subsector"></select>
</div>

<div class="card" id="questions"></div>

<button onclick="generate()">Generate Report</button>
<button onclick="saveClient()">Save Client</button>
<button onclick="downloadPDF()">Download PDF</button>

<div class="card">
<h3>Report</h3>
<div id="report" class="report"></div>
</div>

<script>

// ===== INDUSTRY DATA =====
const subsectors={
engineering:["Process Engineering","Mechanical Engineering","Chemical Engineering"],
medical:["General Practice","Diagnostics","Pharmacy"],
retail:["Phone Retail","Supermarket","Fashion"],
technology:["SaaS","IT Support","Data Analytics"]
};

const questions=[
"Cash control effectiveness",
"Profit visibility",
"Receivables management",
"Operational efficiency",
"Staff productivity",
"Management reporting",
"Risk management",
"Sales effectiveness"
];

// ===== BUILD UI =====
function loadSubsectors(){
let ind=industry.value;
subsector.innerHTML="";
if(!subsectors[ind])return;
subsectors[ind].forEach(s=>{
let o=document.createElement("option");
o.textContent=s;
subsector.appendChild(o);
});
buildQuestions();
}

function buildQuestions(){
let html="";
questions.forEach((q,i)=>{
html+=`
<label>${q}</label>
<select id="q${i}">
<option value="5">Strong</option>
<option value="3">Average</option>
<option value="1">Weak</option>
</select>
<textarea id="c${i}" placeholder="Comment"></textarea>
`;
});
document.getElementById("questions").innerHTML=html;
}

// ===== CORE =====
function avg(arr){return arr.reduce((a,b)=>a+b,0)/arr.length;}

function heat(s){
if(s<2)return "🔴 Critical";
if(s<3.5)return "🟠 Weak";
return "🟢 Strong";
}

// ===== ACTION ENGINE =====
function actionEngine(name,score){
if(score>2)return null;

return{
issue:name,
action:"Improve "+name+" through structured controls and monitoring",
optimization:"Apply cost reduction and efficiency improvements",
result:"10–25% improvement expected"
};
}

// ===== REPORT =====
function generate(){

let scores=[];
let actions=[];

questions.forEach((q,i)=>{
let val=+document.getElementById("q"+i).value;
scores.push(val);

let act=actionEngine(q,val);
if(act)actions.push(act);
});

let overall=avg(scores);

let report=`
FRACTIONAL CONSULTING REPORT

Client: ${clientName.value}
Industry: ${industry.value}
Subsector: ${subsector.value}

--------------------------------

OVERALL SCORE: ${overall.toFixed(2)}
STATUS: ${heat(overall)}

--------------------------------

DETAILED ACTION PLAN

${actions.map(a=>`
ISSUE: ${a.issue}
ACTION: ${a.action}
OPTIMIZATION: ${a.optimization}
EXPECTED RESULT: ${a.result}
`).join("\n")}

--------------------------------

STRATEGIC IMPROVEMENT

- Cost reduction through efficiency
- Revenue optimization strategies
- Better resource utilization
- Scalable systems implementation

--------------------------------

EXPECTED BUSINESS IMPACT

- 10–25% revenue growth
- 5–20% cost reduction
- Improved operational efficiency

`;

document.getElementById("report").innerText=report;

}

// ===== SAVE =====
function saveClient(){
localStorage.setItem("client_"+clientName.value,report.innerText);
alert("Saved");
}

// ===== PDF =====
function downloadPDF(){
let win=window.open('','','width=900,height=700');
win.document.write("<pre>"+report.innerText+"</pre>");
win.print();
}

</script>

</body>
</html>
