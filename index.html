<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fractional Consulting – Commercial Engine</title>

<style>
body{font-family:Arial;background:#0b1220;color:white;padding:20px;}
.card{background:#111827;padding:15px;margin-bottom:15px;border-radius:10px;}
select,input{width:100%;padding:8px;margin-top:5px;background:#020617;color:white;border:1px solid #475569;}
button{padding:12px;background:#f59e0b;border:none;border-radius:6px;font-weight:bold;margin-top:10px;}
.report{white-space:pre-wrap;background:black;padding:15px;border-radius:10px;}
</style>
</head>

<body>

<h1>Fractional Consulting Diagnostic Engine</h1>

<div class="card">
<label>Client Name</label>
<input id="clientName">

<label>Industry</label>
<select id="industry">
<option>Engineering</option>
<option>Healthcare</option>
<option>Retail</option>
<option>Technology</option>
<option>Hospitality</option>
</select>
</div>

<div class="card">
<h3>Diagnostics</h3>

<label>Cash Control</label>
<select id="q1"><option value="5">Strong</option><option value="3">Average</option><option value="1">Weak</option></select>

<label>Profit Visibility</label>
<select id="q2"><option value="5">Strong</option><option value="3">Average</option><option value="1">Weak</option></select>

<label>Receivables</label>
<select id="q3"><option value="5">Strong</option><option value="3">Average</option><option value="1">Weak</option></select>

<label>Operations</label>
<select id="q4"><option value="5">Strong</option><option value="3">Average</option><option value="1">Weak</option></select>

<label>Staffing</label>
<select id="q5"><option value="5">Strong</option><option value="3">Average</option><option value="1">Weak</option></select>

<label>Reporting</label>
<select id="q6"><option value="5">Strong</option><option value="3">Average</option><option value="1">Weak</option></select>

<label>Risk</label>
<select id="q7"><option value="5">Strong</option><option value="3">Average</option><option value="1">Weak</option></select>

<label>Sales</label>
<select id="q8"><option value="5">Strong</option><option value="3">Average</option><option value="1">Weak</option></select>

</div>

<button onclick="generate()">Generate Report</button>

<div class="card">
<h3>Report</h3>
<div id="report" class="report"></div>
</div>

<script>

function avg(arr){return arr.reduce((a,b)=>a+b,0)/arr.length;}

// ===== SECTION WEIGHTS =====
const weights={
financial:0.25,
operations:0.20,
people:0.15,
reporting:0.15,
risk:0.15,
commercial:0.10
};

// ===== GROUPING =====
function getSections(){
return{
financial:[+q1.value,+q2.value,+q3.value],
operations:[+q4.value],
people:[+q5.value],
reporting:[+q6.value],
risk:[+q7.value],
commercial:[+q8.value]
};
}

// ===== HEAT MAP =====
function heat(score){
if(score<2)return "🔴 Critical";
if(score<3.5)return "🟠 Weak";
return "🟢 Strong";
}

// ===== ACTION ENGINE =====
function action(name,score){
if(score>2)return null;

return{
issue:name,
action:"Implement structured controls and monitoring for "+name,
priority:score<=1?"Critical":"High"
};
}

// ===== REPORT ENGINE =====
function generate(){

let sections=getSections();

// weighted score
let total=0;
for(let k in sections){
total+=avg(sections[k])*weights[k];
}

// section scores
let sectionScores=Object.keys(sections).map(k=>({
name:k,
score:avg(sections[k])
}));

// strengths & weaknesses
let strengths=sectionScores.filter(x=>x.score>=4);
let weaknesses=sectionScores.filter(x=>x.score<=2);

// top issues
let issues=sectionScores.sort((a,b)=>a.score-b.score).slice(0,5);

// action plan
let actions=issues.map(i=>action(i.name,i.score)).filter(Boolean);

// ===== REPORT =====
let report=`
FRACTIONAL CONSULTING REPORT

Client: ${clientName.value}
Industry: ${industry.value}

--------------------------------

EXECUTIVE SUMMARY
The business is currently assessed as ${heat(total)} with an overall score of ${total.toFixed(2)}.
The structure indicates imbalance between operational performance and management control systems.

--------------------------------

SECTION PERFORMANCE

${sectionScores.map(s=>`
${s.name.toUpperCase()}:
Score: ${s.score.toFixed(2)} | ${heat(s.score)}
`).join("")}

--------------------------------

KEY STRENGTHS
${strengths.map(s=>s.name).join("\n")||"None"}

--------------------------------

KEY WEAKNESSES
${weaknesses.map(s=>s.name).join("\n")||"None"}

--------------------------------

TOP PRIORITY ISSUES
${issues.map(i=>`${i.name} (${i.score.toFixed(2)})`).join("\n")}

--------------------------------

RECOMMENDED ACTIONS
${actions.map(a=>`
ISSUE: ${a.issue}
ACTION: ${a.action}
PRIORITY: ${a.priority}
`).join("\n")}

--------------------------------

BUSINESS IMPLICATION
Without strengthening weak sections, growth will introduce inefficiencies, risks, and margin erosion.

`;

document.getElementById("report").textContent=report;

}

</script>

</body>
</html>
