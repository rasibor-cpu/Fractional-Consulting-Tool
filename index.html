<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fractional Consulting Tool – Action Plan Upgrade</title>

<style>
body{font-family:Arial;background:#0b1220;color:white;padding:20px;}
.card{background:#111827;padding:15px;margin-bottom:15px;border-radius:10px;}
select,textarea,input{width:100%;margin-top:5px;padding:8px;background:#020617;color:white;border:1px solid #475569;}
button{padding:10px;margin-top:10px;background:#f59e0b;border:none;border-radius:6px;font-weight:bold;}
.report{white-space:pre-wrap;background:black;padding:15px;border-radius:10px;}
</style>
</head>

<body>

<h1>Fractional Consulting Tool</h1>

<div class="card">
<label>Client Name</label>
<input id="clientName">

<label>Industry</label>
<select id="industry">
<option>Engineering</option>
<option>Medical</option>
<option>Retail</option>
</select>
</div>

<div class="card">
<h3>Diagnostics</h3>

<label>Cash Control</label>
<select id="q1"><option value="5">Strong</option><option value="3">Average</option><option value="1">Weak</option></select>

<label>Profit Visibility</label>
<select id="q2"><option value="5">Strong</option><option value="3">Average</option><option value="1">Weak</option></select>

<label>Receivables</label>
<select id="q3"><option value="5">Strong</option><option value="3">Average</option><option value="1">Weak</option></select>

<label>Staffing</label>
<select id="q4"><option value="5">Strong</option><option value="3">Average</option><option value="1">Weak</option></select>

<label>Reporting</label>
<select id="q5"><option value="5">Strong</option><option value="3">Average</option><option value="1">Weak</option></select>

<label>Risk</label>
<select id="q6"><option value="5">Strong</option><option value="3">Average</option><option value="1">Weak</option></select>

</div>

<button onclick="generate()">Generate Report</button>

<div class="card">
<h3>Report</h3>
<div id="report" class="report"></div>
</div>

<script>

function avg(arr){return arr.reduce((a,b)=>a+b,0)/arr.length;}

function getAction(q,score){
if(score>2)return null;

if(q=="Cash Control")return{
issue:"Weak financial controls",
impact:"Risk of fraud, leakages and inaccurate reporting",
action:"Introduce approval limits, reconciliations and segregation of duties",
priority:"High",
timeline:"0-30 days"
};

if(q=="Profit Visibility")return{
issue:"Poor margin visibility",
impact:"Hidden losses and pricing inefficiencies",
action:"Implement margin tracking per product/service",
priority:"High",
timeline:"0-30 days"
};

if(q=="Receivables")return{
issue:"Weak collections process",
impact:"Cash flow pressure and bad debts",
action:"Introduce receivables aging and weekly follow-up discipline",
priority:"High",
timeline:"0-30 days"
};

if(q=="Staffing")return{
issue:"Weak staffing structure",
impact:"Low productivity and inconsistency",
action:"Implement structured hiring and KPI management",
priority:"Critical",
timeline:"0-30 days"
};

if(q=="Reporting")return{
issue:"Lack of management visibility",
impact:"Delayed decisions and hidden risks",
action:"Introduce weekly management dashboard",
priority:"Critical",
timeline:"0-30 days"
};

if(q=="Risk")return{
issue:"Weak risk management",
impact:"Exposure to compliance and operational failures",
action:"Create risk register and monitoring system",
priority:"High",
timeline:"30-90 days"
};

return null;
}

function generate(){

let data=[
{name:"Cash Control",score:+q1.value},
{name:"Profit Visibility",score:+q2.value},
{name:"Receivables",score:+q3.value},
{name:"Staffing",score:+q4.value},
{name:"Reporting",score:+q5.value},
{name:"Risk",score:+q6.value}
];

let scores=data.map(x=>x.score);
let overall=avg(scores);

let status="Moderate";
if(overall<2)status="Critical";
else if(overall<3.5)status="Needs Improvement";
else status="Strong";

// Build action plan
let actions=data.map(d=>getAction(d.name,d.score)).filter(x=>x);

// categorize
let immediate=actions.filter(a=>a.timeline=="0-30 days");
let medium=actions.filter(a=>a.timeline=="30-90 days");
let long=actions.filter(a=>a.timeline=="90+ days");

function formatActions(list){
if(!list.length)return "None";
return list.map((a,i)=>`
${i+1}. ISSUE: ${a.issue}
   WHY IT MATTERS: ${a.impact}
   ACTION: ${a.action}
   PRIORITY: ${a.priority}
`).join("\n");
}

let report=`
FRACTIONAL CONSULTING REPORT

Client: ${clientName.value}

--------------------------------

OVERALL SCORE: ${overall.toFixed(2)}
STATUS: ${status}

--------------------------------

IMMEDIATE ACTION PLAN (0–30 DAYS)
${formatActions(immediate)}

--------------------------------

MEDIUM TERM (30–90 DAYS)
${formatActions(medium)}

--------------------------------

STRATEGIC PLAN (90+ DAYS)
${formatActions(long)}

--------------------------------

ADVISORY NOTE
This action plan is generated based on identified weaknesses and should be implemented with clear ownership and tracking.
`;

document.getElementById("report").textContent=report;

}

</script>

</body>
</html>
