<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractional Consulting Tool V2</title>

<style>
body{font-family:Arial;background:#0b1220;color:white;padding:20px;}
.card{background:#111827;padding:15px;margin-bottom:15px;border-radius:10px;border:1px solid #374151;}
label{display:block;margin-top:10px;font-weight:bold;}
input,select,textarea{width:100%;padding:8px;background:#020617;color:white;border:1px solid #475569;border-radius:6px;}
button{margin-top:10px;padding:10px;background:#f59e0b;border:none;border-radius:6px;font-weight:bold;}
.report{white-space:pre-wrap;background:black;padding:15px;border-radius:10px;}
</style>
</head>

<body>

<h1>Fractional Consulting Tool (V2)</h1>

<div class="card">
<h3>Client Details</h3>

<label>Client Name</label>
<input id="clientName">

<label>Respondent Name</label>
<input id="respondent">

<label>Role</label>
<input id="role">

<label>Industry</label>
<select id="industry" onchange="loadSub()">
<option value="">Select</option>
<option value="engineering">Engineering</option>
<option value="medical">Medical</option>
<option value="technology">Technology</option>
</select>

<label>Sub-sector</label>
<select id="subsector" onchange="loadQuestions()"></select>

<label>Client Reference</label>
<input id="ref" readonly>
</div>

<div class="card">
<h3>Core Diagnostics</h3>

<label>Financial Control Depth</label>
<select id="q1"><option value="5">Strong</option><option value="3">Average</option><option value="1">Weak</option></select>

<label>Operational Leakage</label>
<select id="q2"><option value="5">Low</option><option value="3">Moderate</option><option value="1">High</option></select>

<label>Commercial Effectiveness</label>
<select id="q3"><option value="5">Strong</option><option value="3">Average</option><option value="1">Weak</option></select>

<label>Reporting Visibility</label>
<select id="q4"><option value="5">Clear</option><option value="3">Partial</option><option value="1">Poor</option></select>

</div>

<div class="card">
<h3>Sub-sector Questions</h3>
<div id="questions"></div>
</div>

<div class="card">
<h3>Actions</h3>
<textarea id="actions"></textarea>
</div>

<button onclick="generate()">Generate Report</button>
<button onclick="save()">Save Client</button>
<button onclick="load()">Load Client</button>
<button onclick="exportData()">Export</button>
<input type="file" onchange="importData(event)">

<div class="card">
<h3>Report</h3>
<div id="report" class="report"></div>
</div>

<script>

function generateRef(){
return "FCT-"+Date.now();
}

document.getElementById("ref").value = generateRef();

const subsectors={
engineering:["Civil","Mechanical","Electrical","Chemical","Process","Petroleum","Marine","Industrial","Environmental"],
medical:["General Practice","Surgery","Cardiology","Neurology","Dental","Pharmacy","Diagnostics"],
technology:["SaaS","Cybersecurity","IT Support","Software Dev"]
};

const questionsData={
"Civil":["Project cost control","Site supervision"],
"Chemical":["Process efficiency","Safety compliance"],
"Process":["Throughput optimization","Waste reduction"],
"Cardiology":["Patient flow","Billing accuracy"],
"SaaS":["Retention rate","System uptime"]
};

function loadSub(){
let ind=document.getElementById("industry").value;
let sub=document.getElementById("subsector");
sub.innerHTML="";
subsectors[ind]?.forEach(s=>{
let opt=document.createElement("option");
opt.text=s; sub.add(opt);
});
}

function loadQuestions(){
let sub=document.getElementById("subsector").value;
let div=document.getElementById("questions");
div.innerHTML="";
questionsData[sub]?.forEach((q,i)=>{
div.innerHTML+=`
<label>${q}</label>
<select id="iq${i}">
<option value="5">Strong</option>
<option value="3">Average</option>
<option value="1">Weak</option>
</select>
`;
});
}

function avg(arr){return arr.reduce((a,b)=>a+b,0)/arr.length;}

function generate(){
let name=document.getElementById("clientName").value;
let ref=document.getElementById("ref").value;

let scores=[
+q1.value,+q2.value,+q3.value,+q4.value
];

let total=avg(scores);

let report=`
CLIENT: ${name}
REF: ${ref}

SCORE: ${total}

ACTIONS:
${actions.value}
`;

document.getElementById("report").textContent=report;
}

function save(){
let data=JSON.stringify(getData());
localStorage.setItem(ref.value,data);
alert("Saved");
}

function load(){
let data=localStorage.getItem(ref.value);
if(data) setData(JSON.parse(data));
}

function exportData(){
let data=JSON.stringify(getData());
let blob=new Blob([data]);
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="client.json";
a.click();
}

function importData(e){
let file=e.target.files[0];
let reader=new FileReader();
reader.onload=()=>setData(JSON.parse(reader.result));
reader.readAsText(file);
}

function getData(){
return{
clientName:clientName.value,
ref:ref.value
};
}

function setData(d){
clientName.value=d.clientName;
ref.value=d.ref;
}

</script>

</body>
</html>
